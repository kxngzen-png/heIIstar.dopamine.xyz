<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HELLSTAR — Verified</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #020306;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

/* =========================
   SPACE BACKGROUND
========================= */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -5;

    background:
        radial-gradient(
            ellipse at center,
            rgba(25, 29, 40, .9) 0%,
            rgba(5, 7, 12, .98) 55%,
            #010204 100%
        );
}

.space::before {
    content: "";
    position: absolute;
    inset: -100px;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(150,160,190,.3) 1px, transparent 1.5px);

    background-size:
        75px 75px,
        43px 43px,
        120px 120px;

    background-position:
        10px 20px,
        25px 5px,
        50px 80px;

    opacity: .5;

    animation: starsMove 35s linear infinite;
}

@keyframes starsMove {
    from {
        transform: translate3d(0,0,0);
    }

    to {
        transform: translate3d(-80px,80px,0);
    }
}

/* Moving glow */

.glow {
    position: fixed;
    width: 500px;
    height: 500px;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);

    background: radial-gradient(
        circle,
        rgba(100,110,145,.12),
        transparent 65%
    );

    filter: blur(20px);
    pointer-events: none;
}

/* Film grain */

.grain {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: .08;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
}

/* =========================
   HEADER
========================= */

header {
    height: 76px;
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    border-bottom: 1px solid rgba(255,255,255,.08);

    background: rgba(0,0,0,.18);
    backdrop-filter: blur(10px);
}

.header-logo {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 13px;
    font-weight: 900;
    letter-spacing: -1px;
}

.header-symbol {
    width: 24px;
    height: 24px;

    border: 2px solid white;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
}

.signin {
    display: flex;
    align-items: center;
    gap: 7px;

    color: white;
    text-decoration: none;

    font-size: 12px;
    font-weight: 800;
}

.user-icon {
    width: 17px;
    height: 17px;
    border: 1.5px solid white;
    border-radius: 50%;
    position: relative;
}

.user-icon::after {
    content: "";
    position: absolute;

    width: 9px;
    height: 5px;

    left: 50%;
    bottom: -4px;

    transform: translateX(-50%);

    border: 1.5px solid white;
    border-bottom: 0;

    border-radius: 8px 8px 0 0;
}

/* =========================
   MAIN
========================= */

main {
    min-height: calc(100vh - 76px);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 50px 20px 70px;
}

.container {
    width: 100%;
    max-width: 600px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

/* =========================
   CIRCLE SYMBOL
========================= */

.emblem {
    width: 48px;
    height: 48px;

    border: 2px solid white;
    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 42px;

    font-size: 25px;

    box-shadow:
        0 0 15px rgba(255,255,255,.15);

    animation: emblemFloat 4s ease-in-out infinite;
}

@keyframes emblemFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

/* =========================
   VERIFIED
========================= */

.verified {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 148px;
    height: 42px;

    padding: 0 25px;

    border-radius: 30px;

    background: #f4f4f5;
    color: #111;

    font-size: 13px;
    font-weight: 900;
    letter-spacing: .3px;

    box-shadow:
        0 5px 30px rgba(255,255,255,.08);

    margin-bottom: 43px;
}

/* =========================
   HELLSTAR LOGO
========================= */

.logo-area {
    position: relative;

    margin-bottom: 45px;

    transform: skewX(-7deg);
}

.logo {
    position: relative;

    font-size: clamp(58px, 14vw, 105px);

    line-height: .8;

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        sans-serif;

    font-style: italic;

    font-weight: 900;

    letter-spacing: -6px;

    color: white;

    text-shadow:
        0 0 2px white,
        0 5px 30px rgba(255,255,255,.08);
}

.logo::after {
    content: "★";

    position: absolute;

    right: 4%;
    top: -42%;

    font-size: 40px;

    transform: rotate(15deg);

    text-shadow:
        0 0 15px rgba(255,255,255,.25);
}

.logo-line {
    position: absolute;

    width: 75%;
    height: 5px;

    background: white;

    left: 5%;
    top: -12px;

    transform: rotate(-7deg);

    border-radius: 100%;
}

.logo-line::after {
    content: "";

    position: absolute;

    width: 65%;
    height: 2px;

    background: white;

    right: -5px;
    bottom: -6px;
}

/* =========================
   CTA
========================= */

.cta {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    width: min(330px, 90vw);
    height: 45px;

    border: 2px solid white;
    border-radius: 30px;

    color: white;
    text-decoration: none;

    font-size: 12px;
    font-weight: 900;

    letter-spacing: .5px;

    transition:
        transform .25s ease,
        background .25s ease,
        color .25s ease;

    margin-bottom: 55px;
}

.cta::before {
    content: "";

    position: absolute;

    inset: 4px;

    border: 1px solid rgba(255,255,255,.5);

    border-radius: 25px;
}

.cta:hover {
    background: white;
    color: black;

    transform: scale(1.04);

    box-shadow:
        0 0 35px rgba(255,255,255,.12);
}

/* =========================
   STATUS
========================= */

.status {
    margin-bottom: 22px;
}

.status h2 {
    font-size: 22px;

    font-weight: 900;

    letter-spacing: -1px;
}

.status p {
    margin-top: 8px;

    color: #777;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 2px;
}

/* =========================
   STATS
========================= */

.stats {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 20px;

    color: #e9e9e9;

    font-size: 12px;
    font-weight: 700;
}

.stat {
    display: flex;
    align-items: center;
    gap: 7px;
}

.stat-icon {
    font-size: 17px;
}

.divider {
    width: 1px;
    height: 17px;

    background: rgba(255,255,255,.15);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    header {
        height: 65px;
        padding: 0 16px;
    }

    main {
        min-height: calc(100vh - 65px);

        padding-top: 35px;
    }

    .emblem {
        width: 43px;
        height: 43px;

        margin-bottom: 38px;
    }

    .verified {
        height: 38px;
        min-width: 145px;

        margin-bottom: 40px;
    }

    .logo {
        font-size: 60px;
        letter-spacing: -4px;
    }

    .logo::after {
        font-size: 28px;
    }

    .logo-line {
        height: 3px;
    }

    .cta {
        height: 42px;

        font-size: 11px;

        margin-bottom: 48px;
    }

    .status h2 {
        font-size: 20px;
    }

    .stats {
        font-size: 11px;
        gap: 13px;
    }
}
</style>
</head>


<body>

<div class="space"></div>
<div class="glow"></div>
<div class="grain"></div>


<header>

    <div class="header-logo">
        <div class="header-symbol">★</div>
        HELLSTAR
    </div>

    <a href="#" class="signin">
        <span class="user-icon"></span>
        SIGN IN
    </a>

</header>


<main>

    <div class="container">

        <!-- Circular emblem -->
        <div class="emblem">
            ★
        </div>


        <!-- Verification -->
        <div class="verified">
            VERIFIED
        </div>


        <!-- Main logo -->
        <div class="logo-area">

            <div class="logo-line"></div>

            <div class="logo">
                HELLSTAR
            </div>

        </div>


        <!-- CTA -->
        <a href="#" class="cta">
            JOIN THE PATH TO PARADISE
        </a>


        <!-- Status -->
        <div class="status">

            <h2>
                UNCLAIMED
            </h2>

            <p>
                This item has not been claimed
            </p>

        </div>


        <!-- Stats -->
        <div class="stats">

            <div class="stat">
                <span class="stat-icon">◉</span>
                <span>12 scans</span>
            </div>

            <div class="divider"></div>

            <div class="stat">
                <span class="stat-icon">✦</span>
                <span>0 blessings</span>
            </div>

        </div>

    </div>

</main>


<script>

/* ===================================
   SUBTLE MOUSE LIGHT
=================================== */

const glow = document.querySelector(".glow");

document.addEventListener("mousemove", (event) => {

    const x = event.clientX;
    const y = event.clientY;

    glow.animate(
        {
            left: `${x}px`,
            top: `${y}px`
        },
        {
            duration: 1200,
            fill: "forwards"
        }
    );

});


/* ===================================
   RANDOM STAR TWINKLE
=================================== */

const space = document.querySelector(".space");

for (let i = 0; i < 35; i++) {

    const star = document.createElement("div");

    star.style.position = "absolute";
    star.style.width = Math.random() * 2 + 1 + "px";
    star.style.height = star.style.width;
    star.style.borderRadius = "50%";
    star.style.background = "white";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.opacity = Math.random();

    star.style.boxShadow =
        "0 0 " + (Math.random() * 8 + 2) + "px white";

    star.animate(
        [
            { opacity: .1 },
            { opacity: .9 },
            { opacity: .1 }
        ],
        {
            duration: Math.random() * 3000 + 2000,
            iterations: Infinity
        }
    );

    space.appendChild(star);
}


/* ===================================
   CTA CLICK
=================================== */

document.querySelector(".cta").addEventListener("click", function(e) {

    e.preventDefault();

    this.innerText = "WELCOME TO PARADISE";

    setTimeout(() => {
        this.innerText = "JOIN THE PATH TO PARADISE";
    }, 2500);

});

</script>

</body>
</html>
